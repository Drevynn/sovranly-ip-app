name: Deploy Firestore Rules & Indexes

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
  workflow_dispatch: {}

jobs:
  deploy-firestore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify no git conflict markers
        run: |
          if grep -rn '<<<<<<< HEAD\|=======\|>>>>>>> ' firestore.rules firestore.indexes.json firebase.json 2>/dev/null; then
            echo "::error::Git conflict markers found in Firestore config files. Resolve conflicts before deploying."
            exit 1
          fi
          echo "No conflict markers found."

      - name: Verify database target
        run: |
          if [ -f firebase.json ]; then
            echo "firebase.json exists:"
            cat firebase.json
          else
            echo "::error::firebase.json not found"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules & Indexes
        run: |
          firebase deploy --only firestore --project sovranlyip

      - name: Confirm deployed indexes
        run: |
          firebase firestore:indexes --project sovranlyip || echo "Index listing requires additional permissions"
