<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 640" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan Neon Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Strong Outer Glow Filter -->
    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Crown -->
    <linearGradient id="crownOutlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="crownFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e0a3c" />
      <stop offset="50%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#180828" />
    </linearGradient>

    <!-- Shield Border Bevel Gradient -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="30%" stop-color="#6b21a8" />
      <stop offset="70%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Inner Escutcheon Silver Bevel -->
    <linearGradient id="silverBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Silver C Emblem Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Inner Purple Background Gradient -->
    <radialGradient id="innerPurpleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="80%" stop-color="#18032b" />
      <stop offset="100%" stop-color="#0d0218" />
    </radialGradient>
  </defs>

  <!-- ================= CROWN ================= -->
  <g id="crown-group">
    <!-- Crown Base Arch Band -->
    <path d="M175 165 Q250 178 325 165 L328 178 Q250 192 172 178 Z" fill="#1e0a3c" stroke="#00f0ff" stroke-width="2.5" filter="url(#cyanGlow)" />
    <!-- Crown Base Facet Insets -->
    <rect x="205" y="171" width="16" height="5" rx="1.5" fill="#00f0ff" opacity="0.85" />
    <rect x="242" y="173" width="16" height="5" rx="1.5" fill="#00f0ff" />
    <rect x="279" y="171" width="16" height="5" rx="1.5" fill="#00f0ff" opacity="0.85" />

    <!-- Crown Body -->
    <path d="M175 165 L145 92 L178 122 L205 68 L250 35 L295 68 L322 122 L355 92 L325 165 Q250 178 175 165 Z" 
          fill="url(#crownFillGrad)" 
          stroke="url(#crownOutlineGrad)" 
          stroke-width="3.5" 
          stroke-linejoin="round" 
          stroke-linecap="round"
          filter="url(#cyanGlow)" />

    <!-- Crown Facet Inset Lines (Purple & Cyan Shards) -->
    <path d="M250 35 L250 174" stroke="#a855f7" stroke-width="1.8" opacity="0.7" />
    <path d="M205 68 L235 140 L250 174 L265 140 L295 68" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" fill="none" />
    <path d="M178 122 L235 140" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5" />
    <path d="M322 122 L265 140" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5" />
    <path d="M145 92 L190 155" stroke="#6b21a8" stroke-width="1.5" opacity="0.6" />
    <path d="M355 92 L310 155" stroke="#6b21a8" stroke-width="1.5" opacity="0.6" />

    <!-- Crown Top Orbs / Nodes -->
    <!-- Mid Left Orb -->
    <circle cx="205" cy="65" r="5.5" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" filter="url(#cyanGlow)" />
    <!-- Center Grand Orb -->
    <circle cx="250" cy="30" r="9" fill="#00f0ff" stroke="#ffffff" stroke-width="2" filter="url(#shieldGlow)" />
    <circle cx="250" cy="30" r="4" fill="#ffffff" />
    <!-- Mid Right Orb -->
    <circle cx="295" cy="65" r="5.5" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" filter="url(#cyanGlow)" />
  </g>

  <!-- ================= MAIN SHIELD ================= -->
  <g id="shield-group">
    <!-- Outer Shield Outer Contour & Beveled Rim -->
    <!-- Outer Shield Path: starts from left shoulder, top arch to center peak, down to right shoulder, side bows down, curved bottom tip -->
    <path d="M120 230 Q250 190 250 190 Q250 190 380 230 Q372 380 340 460 Q290 535 250 580 Q210 535 160 460 Q128 380 120 230 Z" 
          fill="#030712" 
          stroke="#00f0ff" 
          stroke-width="4" 
          stroke-linejoin="round" 
          filter="url(#shieldGlow)" />

    <!-- Beveled Outer Rim Facet (Purple Rim) -->
    <path d="M120 230 Q250 190 250 190 Q250 190 380 230 Q372 380 340 460 Q290 535 250 580 Q210 535 160 460 Q128 380 120 230 Z
             M142 245 Q250 214 250 214 Q250 214 358 245 Q351 370 324 442 Q280 508 250 550 Q220 508 176 442 Q149 370 142 245 Z" 
          fill="url(#bevelGrad)" 
          fill-rule="evenodd" 
          stroke="#8b5cf6" 
          stroke-width="1" 
          opacity="0.95" />

    <!-- Inner Neon Cyan Pinstripe -->
    <path d="M144 247 Q250 216 250 216 Q250 216 356 247 Q349 368 322 440 Q278 506 250 548 Q222 506 178 440 Q151 368 144 247 Z" 
          fill="none" 
          stroke="#00f0ff" 
          stroke-width="1.8" 
          stroke-linejoin="round" 
          opacity="0.75" />

    <!-- ================= PCB CIRCUIT BOARD TRACES ================= -->
    <g id="circuits" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)">
      <!-- Upper Left Bracket Traces -->
      <path d="M190 255 L160 255 L150 270 L150 310" fill="none" />
      <circle cx="150" cy="310" r="3.5" fill="#00f0ff" />
      <path d="M205 242 L175 242 L165 255" fill="none" />
      <circle cx="205" cy="242" r="3" fill="#00f0ff" />

      <!-- Upper Right Bracket Traces -->
      <path d="M310 255 L340 255 L350 270 L350 310" fill="none" />
      <circle cx="350" cy="310" r="3.5" fill="#00f0ff" />
      <path d="M295 242 L325 242 L335 255" fill="none" />
      <circle cx="295" cy="242" r="3" fill="#00f0ff" />

      <!-- Mid-Left Horizontal & Stepped Traces -->
      <path d="M178 335 L155 335 L155 375 L148 385" fill="none" />
      <circle cx="148" cy="385" r="3.5" fill="#00f0ff" />
      <path d="M178 360 L165 360 L160 370" fill="none" />
      <circle cx="178" cy="360" r="3" fill="#00f0ff" />

      <path d="M178 400 L160 400 L155 415 L155 435" fill="none" />
      <circle cx="155" cy="435" r="3.5" fill="#00f0ff" />

      <!-- Mid-Right Horizontal & Stepped Traces -->
      <path d="M322 335 L345 335 L345 375 L352 385" fill="none" />
      <circle cx="352" cy="385" r="3.5" fill="#00f0ff" />
      <path d="M322 360 L335 360 L340 370" fill="none" />
      <circle cx="322" cy="360" r="3" fill="#00f0ff" />

      <path d="M322 400 L340 400 L345 415 L345 435" fill="none" />
      <circle cx="345" cy="435" r="3.5" fill="#00f0ff" />

      <!-- Lower Flank Traces Left -->
      <path d="M205 455 L180 475 L180 500 L195 515" fill="none" />
      <circle cx="195" cy="515" r="3.5" fill="#00f0ff" />
      <path d="M220 485 L205 500 L205 525" fill="none" />
      <circle cx="205" cy="525" r="3" fill="#00f0ff" />

      <!-- Lower Flank Traces Right -->
      <path d="M295 455 L320 475 L320 500 L305 515" fill="none" />
      <circle cx="305" cy="515" r="3.5" fill="#00f0ff" />
      <path d="M280 485 L295 500 L295 525" fill="none" />
      <circle cx="295" cy="525" r="3" fill="#00f0ff" />

      <!-- Bottom Tip Core Chevron & Vias -->
      <path d="M235 538 L250 555 L265 538" fill="none" stroke-width="2.5" />
      <circle cx="250" cy="535" r="4" fill="#00f0ff" />
    </g>

    <!-- ================= INNER SHIELD (ESCUTCHEON) ================= -->
    <g id="inner-shield">
      <!-- Inner Shield Shape -->
      <!-- Top corners at (182, 290) and (318, 290), Center top dip at (250, 275), Bottom tip at (250, 465) -->
      <path d="M182 290 Q250 274 250 274 Q250 274 318 290 Q312 390 290 430 Q265 458 250 470 Q235 458 210 430 Q188 390 182 290 Z" 
            fill="url(#innerPurpleGrad)" 
            stroke="url(#silverBevel)" 
            stroke-width="4.5" 
            stroke-linejoin="round" 
            filter="url(#cyanGlow)" />

      <!-- Inner Purple Background Grid/Circuit Lines -->
      <g stroke="#9333ea" stroke-width="1.2" opacity="0.45">
        <line x1="195" y1="320" x2="305" y2="320" />
        <line x1="190" y1="345" x2="310" y2="345" />
        <line x1="190" y1="370" x2="310" y2="370" />
        <line x1="195" y1="395" x2="305" y2="395" />
        <line x1="210" y1="420" x2="290" y2="420" />
      </g>

      <!-- Inner Shield Inset Pinstripe -->
      <path d="M190 298 Q250 284 250 284 Q250 284 310 298 Q305 385 285 422 Q262 448 250 458 Q238 448 215 422 Q195 385 190 298 Z" 
            fill="none" 
            stroke="#c084fc" 
            stroke-width="1.5" 
            opacity="0.6" />

      <!-- ================= CENTRAL 'C' STYLIZED EMBLEM ================= -->
      <g id="stylized-c-emblem" transform="translate(250, 368)">
        <!-- Outer Concentric Aperture Ring with notches -->
        <path d="M-42 0 A42 42 0 0 1 0 -42 A42 42 0 0 1 34 -25" fill="none" stroke="url(#emblemGrad)" stroke-width="5.5" stroke-linecap="round" filter="url(#cyanGlow)" />
        <path d="M34 25 A42 42 0 0 1 0 42 A42 42 0 0 1 -42 0" fill="none" stroke="url(#emblemGrad)" stroke-width="5.5" stroke-linecap="round" filter="url(#cyanGlow)" />

        <!-- Bold Main 'C' Arc -->
        <!-- Sweeps from top-right (+25, -24) counterclockwise through (-32, 0) to bottom-right (+25, +24) -->
        <path d="M22 -24 A32 32 0 1 0 22 24 L14 24 A22 22 0 1 1 14 -24 Z" 
              fill="url(#emblemGrad)" 
              stroke="#ffffff" 
              stroke-width="1.2" 
              filter="url(#shieldGlow)" />

        <!-- Inner Core Ring / Concentric Node -->
        <circle cx="-4" cy="0" r="11" fill="none" stroke="url(#emblemGrad)" stroke-width="3.5" />
        <circle cx="-4" cy="0" r="4.5" fill="#00f0ff" filter="url(#cyanGlow)" />

        <!-- Cybernetic Horizontal Terminal Bars on right -->
        <line x1="22" y1="-24" x2="32" y2="-24" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
        <line x1="22" y1="24" x2="32" y2="24" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
        <line x1="16" y1="0" x2="34" y2="0" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- ================= 'SM' SERVICE MARK (LOWER RIGHT) ================= -->
  <!-- Positioned cleanly at the lower right contour of the shield -->
  <g id="service-mark" transform="translate(352, 535)">
    <rect x="-3" y="-15" width="34" height="20" rx="4" fill="#030712" stroke="#00f0ff" stroke-width="1.5" opacity="0.95" filter="url(#cyanGlow)" />
    <text x="14" y="0" font-family="monospace, sans-serif" font-size="14" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="1">SM</text>
  </g>
</svg>